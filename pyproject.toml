[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erreetool"
version = "1.0.0"
description = "ERREETOOL | Advanced Networking Toolkit with AI-assisted penetration testing"
readme = "README.md"
authors = [
    {name = "anascherif", email = "anascherif@example.com"},
]
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "colorama==0.4.6",
    "dnspython==2.6.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "python-nmap==0.7.1",
    "rich==13.7.1",
    "scapy==2.5.0",
    "speedtest-cli==2.1.3",
    "typer==0.12.3",
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "pydantic==2.7.4",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
]

[project.scripts]
erreetool = "erreetool.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["erreetool*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PIE", # flake8-pie
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in defaults (common in FastAPI)
    "S110",  # try-except-pass (common in utils)
    "BLE001", # blind exception (common in CLI tools)
    "PLW1510", # subprocess without check (common in wrappers)
]
fixable = [
    "F401",  # unused imports
    "F541",  # f-string without placeholders
    "F841",  # unused variables
    "ISC004", # implicit string concatenation
    "C401",  # unnecessary generator
    "UP035", # typing imports
    "UP006", # use list/tuple instead of List/Tuple
    "RUF013", # PEP 484 Optional
    "I001",  # import sorting
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests/",
    ".venv/",
    "__pycache__/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["erreetool"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]